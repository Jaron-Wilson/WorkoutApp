# docker-compose.yml
version: '3.8'

services:
  fitness-tracker:
    build: .
    ports:
      - "8080:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs